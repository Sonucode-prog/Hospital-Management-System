<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Doctor</title>
    <link rel="stylesheet" href="/static/new_doct.css" />
  </head>

  <body>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="{{ url_for('admin') }}">Back</a></li>
        <li><a href="{{ url_for('login') }}">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>

    <div class="admin_main">
      <div class="admin_block">

        <div id="header">
          <h1>Update Doctor</h1>
        </div>

        <div id="main">
          <div id="content">

            <!-- IMPORTANT: Correct action -->
            <form action="/edit_doct/{{ doctor.id }}" method="POST">

              <div class="form-field">
                <label for="fullname">Fullname</label>
                <input
                  id="fullname"
                  name="fullname"
                  type="text"
                  value="{{ doctor.fullname }}"
                  required
                />
              </div>

              <div class="form-field">
                <label for="username">Username</label>
                <input
                  id="username"
                  name="username"
                  type="text"
                  placeholder="Enter username"
                  required
                />
              </div>

              <div class="form-field">
                <label for="password">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter password"
                  required
                />
              </div>

              <div class="form-field">
                <label for="specialization">Specialization</label>
                <input
                  id="specialization"
                  name="specialization"
                  type="text"
                  value="{{ doctor.specialization }}"
                  required
                />
              </div>

              <div class="form-field">
                <label for="department">Department</label>
                <input
                  id="department"
                  name="department"
                  type="text"
                  value="{{ doctor.department }}"
                  required
                />
              </div>

              <div class="form-field">
                <label for="overview">Overview</label>
                <input
                  id="overview"
                  name="overview"
                  type="text"
                  value="{{ doctor.overview }}"
                  required
                />
              </div>

              <div class="form-field">
                <label for="experience">Experience (years)</label>
                <input
                  id="experience"
                  name="experience"
                  type="number"
                  value="{{ doctor.experience }}"
                  required
                />
              </div>

              <div class="actions">
                <button type="submit">Update Doctor</button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </body>
</html>
