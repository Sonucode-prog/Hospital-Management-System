<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ doctor.fullname }} - Profile</title>
    <link rel="stylesheet" href="/static/profile_doctor.css" />
  </head>

  <body>
    <div class="container">
      <!-- Left Section: Doctor Info -->
      <div class="info-box">
        <h1>{{ doctor.fullname }}</h1>

        <p class="qual">MBBS, DM - {{ doctor.specialization }}</p>
        <p class="exp">{{ doctor.experience }} Years Experience Overall</p>

        <p class="bio">{{ overview }}</p>

        <div class="btn-row">
          <a href="/check_availability/{{ doctor_id }}">
            <button class="blue-btn">Check Availability</button>
          </a>

          <a href="javascript:history.back()">
            <button class="gray-btn">Go Back</button>
          </a>
        </div>
      </div>

      <div class="photo-box">
        <img src="/static/profile_doct.jpg" alt="Doctor Photo" />
      </div>
    </div>
  </body>
</html>
